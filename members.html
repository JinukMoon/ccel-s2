<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members · CCEL</title>
<link rel="stylesheet" href="_shared/brand/brand.css">
<link rel="stylesheet" href="css/site.css">
<script>
  // current members first; #alumni or #alumni-<group> opens the alumni view (set before first paint, no flash)
  document.documentElement.setAttribute('data-view', /^#alumni(-|$)/.test(location.hash) ? 'alumni' : 'members');
</script>
</head>
<body class="page-people">
<a class="skip" href="#main">Skip to content</a>

<header class="site-header" id="top">
  <div class="wrap header-inner">
    <a class="brand" href="index.html"><img class="ccel-logo" data-logo alt="CCEL" width="200" height="102"></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul>
        <li><a href="index.html">Welcome</a></li>
        <li><a href="professor.html">Professor</a></li>
        <li><a href="members.html" aria-current="page">Members</a></li>
        <li><a href="research.html">Research</a></li>
        <li><a href="publications.html">Publications</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>
<div class="bar" id="bar" aria-hidden="true">
  <div class="wrap bar-inner">
    <a class="bar-brand" href="index.html"><img class="bar-logo" data-logo alt="CCEL" width="128" height="65"></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="bar-nav">Menu</button>
    <nav class="site-nav" id="bar-nav" aria-label="Main (compact)"><ul></ul></nav>
    <a class="bar-top" href="#top">↑ Top</a>
  </div>
</div>

<main id="main">
  <section class="page-head people-head">
    <div class="wrap page-head-grid">
      <div>
        <h1>Members</h1>
        <p id="people-summary"></p>
        <p class="prof-link" id="prof-link"></p>
      </div>
      <div class="strip"><img id="strip-img" alt="" width="1280" height="560" decoding="async"></div>
    </div>
    <div class="wrap view-bar" id="view-bar">
      <div class="view-row">
        <div class="view-switch" role="group" aria-label="Show current members or alumni">
          <a href="#members" data-show="members">Current members <span class="n" id="n-members"></span></a>
          <a href="#alumni" data-show="alumni">Alumni <span class="n" id="n-alumni"></span></a>
        </div>
        <nav class="group-jumps" id="jumps-members" aria-label="Current member groups"></nav>
        <nav class="group-jumps" id="jumps-alumni" aria-label="Alumni groups"></nav>
      </div>
      <div class="filter-row" role="group" aria-label="Research type">
        <span class="filter-label">Research type</span>
        <button type="button" data-type="" aria-pressed="true">All</button>
        <button type="button" class="computational" data-type="computational" aria-pressed="false"><span class="dot" aria-hidden="true"></span>Computational</button>
        <button type="button" class="experimental" data-type="experimental" aria-pressed="false"><span class="dot" aria-hidden="true"></span>Experimental</button>
      </div>
    </div>
  </section>

  <section id="members" class="section people-view" aria-labelledby="members-title">
    <div class="wrap">
      <h2 class="section-title" id="members-title">Current members</h2>
      <div id="member-groups"></div>
      <p class="view-next"><a href="#alumni">Alumni: former members and their current positions →</a></p>
    </div>
  </section>

  <section id="alumni" class="section people-view" aria-labelledby="alumni-title">
    <div class="wrap">
      <h2 class="section-title" id="alumni-title">Alumni</h2>
      <div id="alumni-groups"></div>
      <p class="view-next"><a href="#members">← Current members</a></p>
    </div>
  </section>
</main>

<footer class="site-footer"><div class="wrap" id="footer-body"></div></footer>

<script src="_shared/content.js"></script>
<script src="js/common.js"></script>
<script src="js/people.js"></script>
</body>
</html>
